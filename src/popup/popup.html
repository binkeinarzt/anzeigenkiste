<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Anzeigenkiste</title>
  <style>
    :root { --bg:#fffdf8; --ink:#1f2a24; --muted:#5d6b63; --line:#e2ddd0; --accent:#1f6f50; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c2320; --ink:#e9ede9; --muted:#9aa8a0; --line:#2d3732; --accent:#4fb589; } }
    body { margin:0; width:300px; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding:14px 16px; border-bottom:1px solid var(--line); font-weight:800; font-size:16px; }
    header span { color:var(--accent); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 16px 4px; }
    .stat { border:1px solid var(--line); border-radius:10px; padding:10px; }
    .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
    .stat small { color:var(--muted); }
    .links { display:grid; gap:6px; padding:12px 16px 16px; }
    button, a { display:block; text-align:center; text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:9px; font:600 14px/1.2 inherit; color:var(--ink); background:none; cursor:pointer; }
    .primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  </style>
</head>
<body>
  <header><span>▣</span> Anzeigenkiste</header>
  <div class="grid">
    <div class="stat"><b id="count">0</b><small>Anzeigen</small></div>
    <div class="stat"><b id="views">0</b><small>Aufrufe</small></div>
  </div>
  <div class="links">
    <button id="open" class="primary">Kiste öffnen</button>
    <a href="https://www.kleinanzeigen.de/m-meine-anzeigen.html" target="_blank" rel="noopener">Meine Anzeigen sichern</a>
    <a href="https://www.kleinanzeigen.de/m-nachrichten.html" target="_blank" rel="noopener">Zum Postfach</a>
  </div>
  <script src="../lib/api.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
